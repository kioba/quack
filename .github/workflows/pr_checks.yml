name: "pr check"

on:
  pull_request:
  push:
    branches:
      - master
      - main
jobs:
  checks_test:
    name: "checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout project"
        uses: actions/checkout@v4

      - name: "set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: "run checks"
        # config cache can't serialize KotlinCompile's classpath snapshot; disable it on CI only
        run: ./gradlew check --no-daemon --no-configuration-cache

  snapshot_test:
    name: "snapshot test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      checks: write

    steps:
      - name: "checkout project"
        uses: actions/checkout@v4

      - name: "set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: "run snapshot verification"
        # config cache can't serialize KotlinCompile's classpath snapshot; disable it on CI only
        run: ./gradlew validateDebugScreenshotTest --no-daemon --no-configuration-cache

      - name: "run test report"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "snapshot test"
          path: "**/build/test-results/**/*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: "upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: |
            **/build/reports/screenshotTest/
            **/build/test-results/validateDebugScreenshotTest/

